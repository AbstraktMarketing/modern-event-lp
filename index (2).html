document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"3abaa614-a39d-4a46-bf9b-bf1d692e6a90\"><\u002Fscript>\n<title>Meet MODERN at Equipped 26<\u002Ftitle>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(\"cc6e53de-3686-465f-821e-df31109ad37c\") format('woff2')}\n@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(\"c80e63a5-c116-40d1-a2c6-f14e692ca257\") format('woff2')}\n@font-face{font-family:'IBM Plex Sans';font-style:italic;font-weight:400;font-display:swap;src:url(\"f6f5889b-5294-42e5-a74e-eb4b81ed66b6\") format('woff2')}\n@font-face{font-family:'IBM Plex Sans';font-style:italic;font-weight:700;font-display:swap;src:url(\"eb0e9978-53c7-45ab-be86-b2235f614532\") format('woff2')}\n@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url(\"5e632da4-6aff-4d96-a47e-12066e59bfed\") format('woff2')}\n@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url(\"76acedb1-fc5e-467c-9976-75eb17a8c8e4\") format('woff2')}\n@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(\"47459205-0fdb-4164-931e-7ab5bb1d0a0b\") format('woff2')}\n@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:700;font-display:swap;src:url(\"9da3084c-afa9-41ae-af11-ed755c5d808f\") format('woff2')}\n@font-face{font-family:'IBM Plex Sans Condensed';font-style:italic;font-weight:600;font-display:swap;src:url(\"0bf16845-3b24-45a7-b946-6f8e934f6371\") format('woff2')}\n@font-face{font-family:'IBM Plex Sans Condensed';font-style:italic;font-weight:700;font-display:swap;src:url(\"1c1f868e-550b-4088-a18d-6b9ead2aabc5\") format('woff2')}\n@font-face{font-family:'IBM Plex Sans Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(\"bb3f36d0-f71b-4919-95ec-5cfa91a7804f\") format('woff2')}\n@font-face{font-family:'IBM Plex Sans Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(\"70e86a1e-7697-4f03-b43a-5abdb910dee4\") format('woff2')}\n\n/* MODERN color tokens — anchored to the logo (cyan play mark #21A1D9 + ink #1A1A1A) and modernis.com.\n   Yellow from the M1 brochure is NOT a brand color and has been removed. */\n:root{\n/* Brand — cyan (logo play mark) */\n--modern-cyan-50:#E9F6FC;--modern-cyan-100:#C9EAF7;--modern-cyan-300:#7CCAEC;--modern-cyan-500:#21A1D9;--modern-cyan-600:#1A8CC0;--modern-cyan-700:#1476A3;\n/* Brand — deep blue (brochure icon badges, photo rings) */\n--modern-blue-50:#EAF3FB;--modern-blue-100:#CFE4F5;--modern-blue-300:#6FB0E3;--modern-blue-400:#1E7FD6;--modern-blue-500:#0B74C2;--modern-blue-600:#0961A3;--modern-blue-700:#074E84;\n--modern-ink:#1A1A1A;/* logo wordmark */\n/* Neutrals */\n--modern-charcoal-950:#0D110F;--modern-charcoal-900:#131917;--modern-charcoal-800:#1C2220;--modern-charcoal-700:#2A302E;--modern-charcoal-600:#3E4543;\n--modern-gray-500:#6B7270;--modern-gray-400:#9AA09E;--modern-gray-300:#C9CDCB;--modern-gray-200:#E3E6E5;--modern-gray-100:#F1F2F2;--modern-gray-50:#F8F8F8;--modern-white:#FFFFFF;\n/* Status (product UI) */\n--modern-green-500:#1E9E5A;--modern-green-50:#E6F5EC;--modern-red-500:#D6331F;--modern-red-50:#FCEBE8;--modern-amber-500:#E8A317;\n\n/* Semantic — surfaces */\n--surface-page:var(--modern-white);--surface-alt:var(--modern-gray-100);--surface-card:var(--modern-white);\n--surface-dark:var(--modern-charcoal-900);--surface-dark-raised:var(--modern-charcoal-800);--surface-accent:var(--modern-cyan-500);--surface-brand:var(--modern-blue-500);\n/* Semantic — text */\n--text-strong:var(--modern-charcoal-900);--text-body:#2A302E;--text-muted:var(--modern-gray-500);--text-inverse:var(--modern-white);--text-inverse-muted:#B9BFBD;\n--text-accent-on-dark:var(--modern-cyan-500);--text-brand:var(--modern-blue-500);--text-on-accent:var(--modern-charcoal-900);--text-on-blue:var(--modern-white);\n/* Semantic — borders */\n--border-subtle:var(--modern-gray-200);--border-default:var(--modern-gray-300);--border-strong:var(--modern-charcoal-900);--border-on-dark:#3E4543;--focus-ring:var(--modern-cyan-500);\n/* Buttons — primary = logo cyan w/ charcoal text (6.4:1); white on cyan fails AA */\n--btn-primary-bg:var(--modern-cyan-500);--btn-primary-bg-hover:var(--modern-cyan-600);--btn-primary-bg-active:var(--modern-cyan-700);--btn-primary-fg:var(--modern-charcoal-900);\n--btn-secondary-bg:var(--modern-blue-500);--btn-secondary-bg-hover:var(--modern-blue-600);--btn-secondary-bg-active:var(--modern-blue-700);--btn-secondary-fg:var(--modern-white);\n/* Status */\n--status-success:var(--modern-green-500);--status-danger:var(--modern-red-500);--status-warning:var(--modern-amber-500);\n}\n\n/* Brochure fonts: IBM Plex Sans (Regular/Medium/Bold), IBM Plex Sans SemiCondensed Bold (headlines),\n   IBM Plex Sans Condensed Bold/SemiBold Italic (quotes). SemiCondensed is not on Google Fonts → Condensed stands in. */\n:root{\n--font-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;\n--font-display:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;\n--font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;\n--weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;\n\n/* Web type scale (px / line-height / tracking) */\n--type-display-size:76px;--type-display-lh:0.94;--type-display-track:-0.005em;\n--type-h1-size:56px;--type-h1-lh:0.98;--type-h1-track:0;\n--type-h2-size:40px;--type-h2-lh:1.04;--type-h2-track:0.005em;\n--type-h3-size:28px;--type-h3-lh:1.15;--type-h3-track:-0.005em;/* bold sentence case subhead */\n--type-h4-size:21px;--type-h4-lh:1.25;--type-h4-track:0;\n--type-feature-size:18px;--type-feature-lh:1.15;--type-feature-track:0.01em;/* KEY FEATURE titles, blue uppercase */\n--type-body-lg-size:19px;--type-body-lg-lh:1.55;\n--type-body-size:16px;--type-body-lh:1.55;\n--type-body-sm-size:14px;--type-body-sm-lh:1.5;\n--type-eyebrow-size:13px;--type-eyebrow-lh:1.2;--type-eyebrow-track:0.12em;/* MEET MODERN */\n--type-caption-size:12px;--type-caption-lh:1.4;\n--type-stat-size:64px;--type-stat-lh:0.9;\n--type-quote-size:26px;--type-quote-lh:1.3;\n}\n\n:root{\n/* Spacing */\n--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;--space-20:80px;--space-24:96px;--space-32:128px;\n--container-max:1200px;--container-pad:24px;--section-pad-y:96px;\n/* Radii — industrial = tight corners; circles are the only soft shape */\n--radius-0:0;--radius-sm:3px;--radius-md:4px;--radius-lg:8px;--radius-full:9999px;\n/* Borders */\n--border-width:1px;--border-thick:2px;--ring-photo:10px;/* thick blue ring on circular crops */\n/* Shadows — used sparingly: device mockups + floating form */\n--shadow-sm:0 1px 2px rgba(19,25,23,.10);--shadow-md:0 6px 18px rgba(19,25,23,.14);--shadow-device:0 18px 40px rgba(13,17,15,.35);--shadow-focus:0 0 0 3px rgba(30,127,214,.45);\n/* Signature diagonal band */\n--stripe-angle:-7deg;/* @kind other */--stripe-yellow-h:14px;--stripe-blue-h:10px;\n/* Motion */\n--ease-out:cubic-bezier(.2,.7,.2,1);/* @kind other */--dur-fast:120ms;/* @kind other */--dur-base:180ms;/* @kind other */--dur-slow:320ms;/* @kind other */\n}\n\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font-family:var(--font-sans);font-size:var(--type-body-size);line-height:var(--type-body-lh);color:var(--text-body);background:var(--surface-page);-webkit-font-smoothing:antialiased}\nimg{max-width:100%;display:block}\na{color:var(--modern-blue-500);text-decoration:underline;text-underline-offset:2px}\na:hover{color:var(--modern-blue-700)}\n.modern-dark a{color:var(--modern-cyan-500)}.modern-dark a:hover{color:var(--modern-cyan-300)}\n:focus-visible{outline:none;box-shadow:var(--shadow-focus)}\n.m-display{font-family:var(--font-display);font-weight:700;font-size:var(--type-display-size);line-height:var(--type-display-lh);text-transform:uppercase;letter-spacing:var(--type-display-track)}\n.m-h1{font-family:var(--font-display);font-weight:700;font-size:var(--type-h1-size);line-height:var(--type-h1-lh);text-transform:uppercase}\n.m-h2{font-family:var(--font-display);font-weight:700;font-size:var(--type-h2-size);line-height:var(--type-h2-lh);text-transform:uppercase;letter-spacing:var(--type-h2-track)}\n.m-h3{font-family:var(--font-sans);font-weight:700;font-size:var(--type-h3-size);line-height:var(--type-h3-lh);letter-spacing:var(--type-h3-track)}\n.m-h4{font-family:var(--font-sans);font-weight:700;font-size:var(--type-h4-size);line-height:var(--type-h4-lh)}\n.m-feature{font-family:var(--font-display);font-weight:700;font-size:var(--type-feature-size);line-height:var(--type-feature-lh);text-transform:uppercase;letter-spacing:var(--type-feature-track);color:var(--text-brand)}\n.m-eyebrow{font-family:var(--font-sans);font-weight:700;font-size:var(--type-eyebrow-size);line-height:var(--type-eyebrow-lh);text-transform:uppercase;letter-spacing:var(--type-eyebrow-track)}\n.m-body-lg{font-size:var(--type-body-lg-size);line-height:var(--type-body-lg-lh)}\n.m-body-sm{font-size:var(--type-body-sm-size);line-height:var(--type-body-sm-lh)}\n@media (max-width:820px){.m-header-nav{display:none!important}.m-header-burger{display:inline-flex!important}}\n.m-caption{font-size:var(--type-caption-size);line-height:var(--type-caption-lh)}\n\n<\u002Fstyle>\n<script src=\"0cb1a250-5082-4dba-9710-cfb61b02a92f\"><\u002Fscript>\n<style>html{scroll-behavior:smooth}body{margin:0}a{color:var(--modern-blue-500)}a:hover{color:var(--modern-blue-600)}<\u002Fstyle>\n<\u002Fhelmet>\n<div id=\"top\" style=\"font-family:var(--font-sans);color:var(--text-body);background:#fff\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.SiteHeader\" logo-src=\"assets/modern-logo-dark.png\" announcement=\"{{ announcement }}\" links=\"{{ navLinks }}\" cta-label=\"{{ headerCta }}\" cta-href=\"{{ bookHref }}\" hint-size=\"100%,108px\"><\u002Fx-import>\n\n<section data-screen-label=\"01 Hero\" style=\"position:relative;overflow:hidden;background:var(--modern-charcoal-900);color:#fff;padding:80px 0 160px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.DiagonalBands\" top=\"calc(100% - 100px)\" angle=\"{{ -6 }}\" bands=\"{{ bandsCB }}\" thickness=\"{{ 16 }}\" fill-below=\"white\" hint-size=\"0,0\"><\u002Fx-import>\n<div style=\"position:relative;max-width:1200px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:56px;align-items:center\">\n<div style=\"display:flex;flex-direction:column;gap:22px\">\n<div style=\"display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:var(--modern-cyan-500)\">Equipped 26 | Indianapolis | October 7 &amp; 8<\u002Fdiv>\n<sc-if value=\"{{ preShow }}\" hint-placeholder-val=\"{{ true }}\">\n<h1 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(44px,6.4vw,80px);line-height:.94;text-transform:uppercase;text-wrap:balance\">Meet MODERN at Equipped 26<\u002Fh1>\n<p style=\"margin:0;max-width:560px;font-size:19px;line-height:1.55;color:#DDE1DF;text-wrap:pretty\">Heading to Texada's Equipped 26? Book 20 minutes with our team and see how heavy equipment dealers are getting faster approvals, fewer phone calls, and more service revenue from the same work orders.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:6px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.Button\" size=\"lg\" arrow=\"{{ true }}\" href=\"{{ bookHref }}\" hint-size=\"260px,56px\">Book a Time at the Show<\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.Button\" size=\"lg\" variant=\"outline\" on-dark=\"{{ true }}\" href=\"#event\" hint-size=\"220px,56px\">Find Us at {{ boothLabel }}<\u002Fx-import>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:15px;color:#DDE1DF\">Can't make it to Indy? <a href=\"#connect\" style=\"color:var(--modern-cyan-500);font-weight:700\">Schedule a demo<\u002Fa> instead.<\u002Fp>\n<\u002Fsc-if>\n<sc-if value=\"{{ postShow }}\" hint-placeholder-val=\"{{ false }}\">\n<h1 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(44px,6.4vw,80px);line-height:.94;text-transform:uppercase;text-wrap:balance\">Thanks for Visiting Us at Equipped 26<\u002Fh1>\n<p style=\"margin:0;max-width:560px;font-size:19px;line-height:1.55;color:#DDE1DF;text-wrap:pretty\">Missed us in Indy, or want to pick up where we left off? Book a follow-up walkthrough with our team.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:6px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.Button\" size=\"lg\" arrow=\"{{ true }}\" href=\"{{ bookHref }}\" hint-size=\"230px,56px\">Schedule My Demo<\u002Fx-import>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"position:relative;width:100%;max-width:600px;margin:0 auto;aspect-ratio:1.35\">\n<div style=\"position:absolute;left:0;top:4%;width:86%\"><x-import component-from-global-scope=\"ModernDesignSystem_c0350e.DeviceMockup\" kind=\"laptop-approvals\" asset-base=\"assets/images/\" width=\"100%\" hint-size=\"100%,300px\"><\u002Fx-import><\u002Fdiv>\n<div style=\"position:absolute;right:0;bottom:0;width:30%\"><x-import component-from-global-scope=\"ModernDesignSystem_c0350e.DeviceMockup\" kind=\"phone-sms\" asset-base=\"assets/images/\" width=\"100%\" hint-size=\"100%,300px\"><\u002Fx-import><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ preShow }}\" hint-placeholder-val=\"{{ true }}\">\n<section data-screen-label=\"02 Why Stop By\" id=\"why\" style=\"background:#fff;padding:24px 0 96px\">\n<div style=\"max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:44px\">\n<h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1.02;text-transform:uppercase;color:var(--modern-charcoal-900);text-wrap:balance\">Three Reasons to Find Us in Indy<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px\">\n<div style=\"display:flex;flex-direction:column;gap:14px;background:#fff;border:1px solid var(--border-subtle);border-top:4px solid var(--modern-cyan-500);border-radius:4px;padding:28px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.IconBadge\" icon=\"play\" tone=\"blue\" size=\"{{ 52 }}\" hint-size=\"52px,52px\"><\u002Fx-import>\n<p style=\"margin:0;font-size:17px;line-height:1.55;text-wrap:pretty\"><b style=\"color:var(--modern-charcoal-900)\">See it live.<\u002Fb> Watch a work order move from check-in to approval to invoice, with the customer in the loop the whole way.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px;background:#fff;border:1px solid var(--border-subtle);border-top:4px solid var(--modern-cyan-500);border-radius:4px;padding:28px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.IconBadge\" icon=\"handshake\" tone=\"blue\" size=\"{{ 52 }}\" hint-size=\"52px,52px\"><\u002Fx-import>\n<p style=\"margin:0;font-size:17px;line-height:1.55;text-wrap:pretty\"><b style=\"color:var(--modern-charcoal-900)\">Talk shop with dealer veterans.<\u002Fb> MODERN was built by people who've run service departments. Bring your toughest workflow and we'll show you how it fits.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px;background:#fff;border:1px solid var(--border-subtle);border-top:4px solid var(--modern-cyan-500);border-radius:4px;padding:28px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.IconBadge\" icon=\"bolt\" tone=\"blue\" size=\"{{ 52 }}\" hint-size=\"52px,52px\"><\u002Fx-import>\n<p style=\"margin:0;font-size:17px;line-height:1.55;text-wrap:pretty\"><b style=\"color:var(--modern-charcoal-900)\">Get a first look at what's next.<\u002Fb> Be one of the first dealers to see our newest features before they launch.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<section data-screen-label=\"03 The Problem\" style=\"position:relative;overflow:hidden;background:var(--modern-gray-100);padding:96px 0\">\n<div style=\"position:relative;max-width:1200px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:56px;align-items:center\">\n<div style=\"display:flex;justify-content:center\"><x-import component-from-global-scope=\"ModernDesignSystem_c0350e.PhotoCircle\" src=\"assets/images/photo-technician-tire-tablet.jpg\" size=\"{{ 400 }}\" ring=\"{{ 14 }}\" hint-size=\"400px,400px\"><\u002Fx-import><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<div style=\"font-weight:700;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--modern-blue-500)\">Meet MODERN<\u002Fdiv>\n<h2 style=\"margin:0;font-weight:700;font-size:36px;line-height:1.1;color:var(--modern-charcoal-900)\">Built by Dealers, for Dealers.<\u002Fh2>\n<p style=\"margin:0;font-size:18px;line-height:1.6;text-wrap:pretty\"><b style=\"color:var(--modern-charcoal-900)\">You know the frustration:<\u002Fb> customers calling for updates, advisors buried on the phone, and approvals stuck in limbo. MODERN connects your DMS/ERP, work orders, service teams, parts, and customers in one connected workflow. From scheduling and approvals to parts updates and payments, your customers stay informed every step of the way. No surprises, faster approvals, and invoices that get paid sooner.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"04 Proof\" id=\"proof\" style=\"position:relative;overflow:hidden;background:var(--modern-charcoal-900);color:#fff;padding:96px 0\">\n<div style=\"position:relative;max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:44px\">\n<h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1.02;text-transform:uppercase;text-wrap:balance\">The Numbers Dealers Are Seeing<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.StatCallout\" on-dark=\"{{ true }}\" value=\"48\" suffix=\"sec\" label=\"average message response time\" hint-size=\"100%,110px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.StatCallout\" on-dark=\"{{ true }}\" value=\"18%\" label=\"more revenue on the same work order count\" hint-size=\"100%,110px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.StatCallout\" on-dark=\"{{ true }}\" value=\"20%\" label=\"more efficient service advisors\" hint-size=\"100%,110px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.StatCallout\" on-dark=\"{{ true }}\" value=\"24/7\" label=\"updates without calling the service department\" hint-size=\"100%,110px\"><\u002Fx-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"05 Works With Your DMS\" id=\"dms\" style=\"position:relative;overflow:hidden;background:#fff;padding:0 0 96px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.DiagonalBands\" top=\"-40px\" angle=\"{{ -4 }}\" bands=\"{{ bandsB }}\" thickness=\"{{ 14 }}\" hint-size=\"0,0\"><\u002Fx-import>\n<div style=\"position:relative;max-width:1200px;margin:0 auto;padding:112px 24px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:56px;align-items:center\">\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.IconBadge\" icon=\"gears\" tone=\"cyan\" size=\"{{ 60 }}\" hint-size=\"60px,60px\"><\u002Fx-import>\n<h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1.02;text-transform:uppercase;color:var(--modern-charcoal-900);text-wrap:balance\">A Power-Up for the DMS You Already Use<\u002Fh2>\n<p style=\"margin:0;font-size:18px;line-height:1.6;text-wrap:pretty\">Nobody loves their dealer management system, but nobody can run without it. MODERN syncs with your DMS or ERP without replacing it or writing over your data. It adds the customer communication, photos, approvals, and updates your DMS was never built to handle.<\u002Fp>\n<p style=\"margin:0;font-size:18px;line-height:1.6;text-wrap:pretty\"><b style=\"color:var(--modern-charcoal-900)\">Already running Texada?<\u002Fb> MODERN is a proud Texada partner, and we'll show you how the two work together at the show.<\u002Fp>\n<\u002Fdiv>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.DeviceMockup\" src=\"assets/images/mockup-laptop-work-order.png\" width=\"100%\" hint-size=\"100%,340px\"><\u002Fx-import>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"06 Key Features\" id=\"features\" style=\"background:var(--modern-gray-100);padding:96px 0\">\n<div style=\"max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:44px\">\n<div style=\"display:flex;flex-direction:column;gap:10px;max-width:760px\">\n<div style=\"font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--modern-blue-500)\">Key Features<\u002Fdiv>\n<h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1.02;text-transform:uppercase;color:var(--modern-charcoal-900);text-wrap:balance\">Everything Your Service Department Has Been Missing<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.FeatureCard\" variant=\"card\" icon=\"comment-sms\" title=\"Two-Way SMS &amp; Email\" description=\"Keep customers updated in real time. No phone tag, no hold music, no missed calls.\" hint-size=\"100%,130px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.FeatureCard\" variant=\"card\" icon=\"file-signature\" title=\"Digital Approvals &amp; Signature Capture\" description=\"Collect approvals on the customer's phone with a documented approval trail.\" hint-size=\"100%,130px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.FeatureCard\" variant=\"card\" icon=\"camera\" title=\"Photo &amp; Video Markups\" description=\"Show customers exactly what your techs see, so recommended repairs are easier to approve.\" hint-size=\"100%,130px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.FeatureCard\" variant=\"card\" icon=\"gears\" title=\"DMS/ERP Integration &amp; Work Order Sync\" description=\"Connect work orders, communication, and approvals to your existing DMS or ERP.\" hint-size=\"100%,130px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.FeatureCard\" variant=\"card\" icon=\"bell\" title=\"Automated Status Notifications\" description=\"Customers get updates automatically as work order statuses change.\" hint-size=\"100%,130px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.FeatureCard\" variant=\"card\" icon=\"boxes-stacked\" title=\"Parts Communication\" description=\"Manage parts requests, quotes, approvals, and updates in one connected workflow.\" hint-size=\"100%,130px\"><\u002Fx-import>\n<\u002Fdiv>\n<div style=\"display:flex\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.Button\" variant=\"secondary\" arrow=\"{{ true }}\" href=\"https://modernis.com/software-platform/\" hint-size=\"220px,48px\">See the full platform<\u002Fx-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showFirstLook }}\" hint-placeholder-val=\"{{ true }}\">\n<section data-screen-label=\"07 First Look\" id=\"first-look\" style=\"position:relative;overflow:hidden;background:var(--modern-charcoal-900);color:#fff;padding:96px 0\">\n<div style=\"position:relative;max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:44px\">\n<div style=\"display:flex;flex-direction:column;gap:10px;max-width:760px\">\n<div style=\"display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--modern-cyan-500)\"><span style=\"width:28px;height:4px;background:var(--modern-cyan-500)\"><\u002Fspan>Coming Soon<\u002Fdiv>\n<h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1.02;text-transform:uppercase;text-wrap:balance\">See What's Next Before Anyone Else<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px\">\n<div style=\"display:flex;flex-direction:column;gap:16px;background:var(--surface-dark-raised);border-top:4px solid var(--modern-cyan-500);border-radius:4px;padding:32px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.IconBadge\" icon=\"paper-plane\" tone=\"cyan\" size=\"{{ 56 }}\" hint-size=\"56px,56px\"><\u002Fx-import>\n<h3 style=\"margin:0;font-weight:700;font-size:24px;line-height:1.15;color:var(--modern-cyan-500)\">Customer Outreach<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.6;color:#DDE1DF;text-wrap:pretty\">Stop waiting for the phone to ring. MODERN uses machine telematics to spot equipment that's due for service and reaches out to the customer first, so you can fill your bays during slow weeks and keep their machines ready when the job calls.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:16px;background:var(--surface-dark-raised);border-top:4px solid var(--modern-cyan-500);border-radius:4px;padding:32px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.IconBadge\" icon=\"mobile-screen-button\" tone=\"cyan\" size=\"{{ 56 }}\" hint-size=\"56px,56px\"><\u002Fx-import>\n<h3 style=\"margin:0;font-weight:700;font-size:24px;line-height:1.15;color:var(--modern-cyan-500)\">Service Check-In<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.6;color:#DDE1DF;text-wrap:pretty\">A smooth, phone-based check-in for every machine that rolls in. Scan the VIN, pull up the unit's details, and interact with the customer in real time at drop-off.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.Button\" size=\"lg\" arrow=\"{{ true }}\" href=\"{{ bookHref }}\" hint-size=\"300px,56px\">Book a Time for a First Look<\u002Fx-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<section data-screen-label=\"08 Testimonial\" style=\"position:relative;overflow:hidden;background:#fff;padding:96px 0 88px\">\n<div style=\"position:relative;max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:64px\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:56px;align-items:center\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.Testimonial\" on-dark=\"{{ false }}\" size=\"lg\" lead=\"It gives the technician the ability to go to one spot\" quote=\"to see if jobs have been approved, if the customer has questions, if there's a parts issue, or even just a parts update. Being on the floor, you don't have to keep coming into the office and asking those questions.\" name=\"Logan Lammert\" title=\"Shop Foreman\" company=\"Vermeer Midwest\" hint-size=\"100%,380px\"><\u002Fx-import>\n<div style=\"display:flex;justify-content:center\"><x-import component-from-global-scope=\"ModernDesignSystem_c0350e.PhotoCircle\" src=\"assets/images/photo-technician-engine-bay.jpg\" size=\"{{ 360 }}\" ring=\"{{ 14 }}\" hint-size=\"360px,360px\"><\u002Fx-import><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:2px solid var(--modern-charcoal-900);padding-top:28px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.PartnerStrip\" label=\"Trusted by the Industry's Best\" partners=\"{{ partners }}\" more=\"\" hint-size=\"100%,80px\"><\u002Fx-import>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"09 Final CTA\" id=\"event\" style=\"position:relative;overflow:hidden;background:var(--modern-charcoal-900);color:#fff;padding:104px 0 96px;scroll-margin-top:110px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.DiagonalBands\" top=\"28px\" angle=\"{{ -2 }}\" bands=\"{{ bandsCB }}\" thickness=\"{{ 10 }}\" hint-size=\"0,0\"><\u002Fx-import>\n<div style=\"position:relative;max-width:1200px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:56px;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:22px\">\n<sc-if value=\"{{ preShow }}\" hint-placeholder-val=\"{{ true }}\">\n<h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(40px,5vw,60px);line-height:.96;text-transform:uppercase;text-wrap:balance\">Let's Talk at Equipped 26<\u002Fh2>\n<p style=\"margin:0;max-width:520px;font-size:18px;line-height:1.6;color:#DDE1DF;text-wrap:pretty\">Spots on our calendar are limited during the show. Grab a time now and we'll have a walkthrough ready for your dealership.<\u002Fp>\n<sc-if value=\"{{ hasSpecial }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;align-items:center;gap:14px;background:var(--modern-cyan-500);color:var(--modern-charcoal-900);border-radius:4px;padding:16px 20px;font-weight:700;font-size:17px;line-height:1.4\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.Icon\" name=\"star\" size=\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fx-import>\n<span>{{ special }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.Button\" size=\"lg\" arrow=\"{{ true }}\" href=\"{{ bookHref }}\" hint-size=\"260px,56px\">Book a Time at the Show<\u002Fx-import>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border-on-dark);padding-top:24px;margin-top:8px;font-weight:600;font-size:16px\">\n<div style=\"font-family:var(--font-display);font-weight:700;font-size:26px;text-transform:uppercase\">Texada Equipped 26<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px 28px\">\n<span style=\"display:inline-flex;align-items:center;gap:8px\"><x-import component-from-global-scope=\"ModernDesignSystem_c0350e.Icon\" name=\"calendar-days\" size=\"{{ 16 }}\" color=\"var(--modern-cyan-500)\" hint-size=\"16px,16px\"><\u002Fx-import>October 7 &amp; 8, 2026<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:8px\"><x-import component-from-global-scope=\"ModernDesignSystem_c0350e.Icon\" name=\"location-dot\" size=\"{{ 16 }}\" color=\"var(--modern-cyan-500)\" hint-size=\"16px,16px\"><\u002Fx-import>Indianapolis, IN<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:8px\"><x-import component-from-global-scope=\"ModernDesignSystem_c0350e.Icon\" name=\"ticket\" size=\"{{ 16 }}\" color=\"var(--modern-cyan-500)\" hint-size=\"16px,16px\"><\u002Fx-import>{{ boothLabel }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ postShow }}\" hint-placeholder-val=\"{{ false }}\">\n<h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(40px,5vw,60px);line-height:.96;text-transform:uppercase;text-wrap:balance\">Pick Up Where We Left Off<\u002Fh2>\n<p style=\"margin:0;max-width:520px;font-size:18px;line-height:1.6;color:#DDE1DF;text-wrap:pretty\">Missed us in Indy, or want to pick up where we left off? Book a follow-up walkthrough with our team.<\u002Fp>\n<div style=\"display:flex\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.Button\" size=\"lg\" arrow=\"{{ true }}\" href=\"{{ bookHref }}\" hint-size=\"230px,56px\">Schedule My Demo<\u002Fx-import>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div id=\"connect\" style=\"scroll-margin-top:120px;background:var(--surface-dark-raised);border-top:6px solid var(--modern-cyan-500);border-radius:4px;padding:28px\">\n<sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n<form sc-camel-no-validate=\"{{ true }}\" sc-camel-on-submit=\"{{ submit }}\" style=\"display:flex;flex-direction:column;gap:16px\">\n<div style=\"font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;color:#fff\">{{ formTitle }}<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.TextField\" label=\"First Name\" name=\"firstName\" required=\"{{ true }}\" on-dark=\"{{ true }}\" error=\"{{ errors.firstName }}\" hint-size=\"100%,72px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.TextField\" label=\"Last Name\" name=\"lastName\" required=\"{{ true }}\" on-dark=\"{{ true }}\" error=\"{{ errors.lastName }}\" hint-size=\"100%,72px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.TextField\" label=\"Dealership\" name=\"dealership\" required=\"{{ true }}\" on-dark=\"{{ true }}\" error=\"{{ errors.dealership }}\" hint-size=\"100%,72px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.TextField\" label=\"Email\" name=\"email\" type=\"email\" required=\"{{ true }}\" on-dark=\"{{ true }}\" error=\"{{ errors.email }}\" hint-size=\"100%,72px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.TextField\" label=\"Phone\" name=\"phone\" type=\"tel\" on-dark=\"{{ true }}\" hint-size=\"100%,72px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.TextField\" label=\"Your DMS (optional)\" name=\"dms\" on-dark=\"{{ true }}\" hint-size=\"100%,72px\"><\u002Fx-import>\n<\u002Fdiv>\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.Button\" type=\"submit\" size=\"lg\" arrow=\"{{ true }}\" full-width=\"{{ true }}\" hint-size=\"100%,56px\">Request a Demo<\u002Fx-import>\n<\u002Fform>\n<\u002Fsc-if>\n<sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:14px;align-items:flex-start\">\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.IconBadge\" icon=\"check\" tone=\"cyan\" size=\"{{ 56 }}\" hint-size=\"56px,56px\"><\u002Fx-import>\n<div style=\"font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1;text-transform:uppercase;color:#fff\">Request received.<\u002Fdiv>\n<p style=\"margin:0;font-size:16px;color:#DDE1DF\">The MODERN team will reach out to set up your demo.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"10 FAQ\" id=\"faq\" style=\"background:#fff;padding:96px 0\">\n<div style=\"max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:40px\">\n<h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1.02;text-transform:uppercase;color:var(--modern-charcoal-900)\">FAQ<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:0 56px\">\n<sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--modern-charcoal-900);padding:24px 0 32px\">\n<h3 style=\"margin:0;font-weight:700;font-size:20px;line-height:1.25;color:var(--modern-charcoal-900)\">{{ f.q }}<\u002Fh3>\n<p style=\"margin:0;font-size:17px;line-height:1.6;text-wrap:pretty\">{{ f.a }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<x-import component-from-global-scope=\"ModernDesignSystem_c0350e.SiteFooter\" logo-src=\"assets/modern-logo-white.png\" hint-size=\"100%,340px\"><\u002Fx-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;postShow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Page state&quot;},&quot;booth&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Event&quot;},&quot;bookingUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Event&quot;},&quot;special&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Event&quot;},&quot;showFirstLook&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = { sent: false, errors: {} };\n  submit = (e) => {\n    e.preventDefault();\n    const d = Object.fromEntries(new FormData(e.currentTarget).entries());\n    const errors = {};\n    ['firstName', 'lastName', 'dealership', 'email'].forEach((k) => { if (!d[k]) errors[k] = 'Required'; });\n    if (d.email && !/^\\S+@\\S+\\.\\S+$/.test(d.email)) errors.email = 'Enter a valid email';\n    this.setState({ errors, sent: !Object.keys(errors).length });\n  };\n  renderVals() {\n    const p = this.props;\n    const post = p.postShow ?? false;\n    const booth = (p.booth || '').trim();\n    const boothLabel = booth ? 'Booth ' + booth : 'Booth [#]';\n    const special = (p.special || '').trim();\n    return {\n      preShow: !post, postShow: post,\n      showFirstLook: !post && (p.showFirstLook ?? true),\n      hasSpecial: !post && !!special, special,\n      boothLabel,\n      bookHref: (p.bookingUrl || '').trim() || '#event',\n      headerCta: post ? 'Schedule My Demo' : 'Book a Time at the Show',\n      announcement: post ? 'Thanks for visiting us at Equipped 26 · Book a follow-up walkthrough' : 'Meet MODERN at Texada’s Equipped 26 · Indianapolis · October 7 & 8 · ' + boothLabel,\n      navLinks: [{ label: 'Why Stop By', href: post ? '#proof' : '#why' }, { label: 'Results', href: '#proof' }, { label: 'Features', href: '#features' }, { label: 'FAQ', href: '#faq' }],\n      bandsCB: ['cyan', 'blue'], bandsB: ['blue'],\n      partners: ['Bobcat', 'Vermeer', 'CNH', 'John Deere', 'Volvo', 'Ditch Witch', 'Komatsu', 'Kubota'],\n      formTitle: post ? 'Let’s Connect.' : 'Won’t Be in Indy? Let’s Still Connect.',\n      submit: this.submit, sent: this.state.sent, notSent: !this.state.sent, errors: this.state.errors,\n      faqs: [\n        { q: 'What is MODERN?', a: 'MODERN is a two-way customer interaction platform built for heavy equipment dealers. It connects customers, service teams, parts, and your DMS in one workflow so approvals move faster.' },\n        { q: 'Does MODERN replace my DMS?', a: 'No. MODERN works alongside your existing DMS or ERP and syncs work order data without writing over your core system.' },\n        { q: 'Which dealers use MODERN?', a: 'Construction, agriculture, material handling, mining, sanitation, forestry, and landscape dealers across the US and Canada, including dealers for Bobcat, Vermeer, John Deere, and Kubota.' },\n        { q: 'How do I meet the MODERN team at Equipped 26?', a: 'Book a time using the button above, or stop by ' + (booth ? 'booth ' + booth : 'booth [#]') + ' on October 7 or 8 in Indianapolis.' },\n      ].slice(0, post ? 3 : 4),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
